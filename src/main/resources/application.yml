server:
  port: 8081

spring:
  application:
    name: hr-payroll-management-system

  profiles:
    active: dev
  
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  # កែតម្រូវការចុះបន្ទាត់ត្រង់នេះ
  app:
    security:
      max-failed-attempts: 5
      lock-duration-minutes: 1
      access-token-expiration-seconds: 3600

logging:
  level:
    root: INFO