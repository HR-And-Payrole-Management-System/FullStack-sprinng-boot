server:
  port: 8081

spring:
  application:
    name: hr-payroll-management-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    cache: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  security:
    max-failed-attempts: 5
    lock-duration-minutes: 1
    access-token-expiration-seconds: 86400
    jwt-secret: ${JWT_SECRET}
  attendance:
    qr:
      secret: ${ATTENDANCE_QR_SECRET:${app.security.jwt-secret}}
      rotation-seconds: ${ATTENDANCE_QR_ROTATION_SECONDS:20}
  contact:
    recipient-email: ${CONTACT_RECIPIENT_EMAIL:your-email@example.com}

  upload:
    dir: upload/photos
    attachments-dir: upload/attachments
    documents-dir: upload/documents

logging:
  level:
    root: INFO
